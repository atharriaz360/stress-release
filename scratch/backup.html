<html lang="en" data-theme="dark" data-palette="gold" data-motion="gentle">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="CalmStudio Desk — offline workspace for makers. Less admin, clearer priorities.">
<title>CalmStudio Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230a0907'/%3E%3Cpath d='M7 16h18' stroke='%23d4af6a' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23d4af6a'/%3E%3C/svg%3E">
<script>
(function(){
  try{
    var raw=localStorage.getItem("calmstudio.desk.v2");
    if(!raw)return;
    var s=(JSON.parse(raw)||{}).settings||{};
    var pal=["gold","jet","emerald","violet","rose","azure"];
    var el=document.documentElement;
    el.dataset.theme   = (s.theme==="light")?"light":"dark";
    el.dataset.palette = (pal.indexOf(s.palette)>=0?s.palette:"gold");
    el.dataset.motion  = (s.motion===false)?"calm":"gentle";
  }catch(e){}
})();
</script>
<style>
:root{--bg:#f6f1e6;--panel:#fffcf5;--raise:#f0e8d6;--line:#e2d6b9;--text:#1b1710;--muted:#7a6f58;--gold:#a67c2e;--gold2:#d2ad63;--on-gold:#1a1408;--ok:#3f7a5a;--warn:#a5741c;--bad:#a83c2e;--glow:rgba(166,124,46,.10);--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--r:14px}

[data-theme=dark][data-palette=jet]{--bg:#000000;--panel:#080808;--raise:#131313;--line:rgba(255,255,255,.11);--text:#f5f5f5;--muted:#8b8b8b;--gold:#e8e8e8;--gold2:#ffffff;--on-gold:#000000;--glow:rgba(255,255,255,.06);--ok:#8fd6b4;--warn:#e0c98a;--bad:#f0a09a}
[data-theme=light][data-palette=jet]{--gold:#111111;--gold2:#3a3a3a;--on-gold:#ffffff;--glow:rgba(0,0,0,.07)}
[data-theme=dark][data-palette=emerald]{--gold:#59c08d;--gold2:#9fe4c0;--on-gold:#04150c;--glow:rgba(89,192,141,.12)}
[data-theme=light][data-palette=emerald]{--gold:#1f7a4d;--gold2:#3fa876;--on-gold:#ffffff;--glow:rgba(31,122,77,.10)}
[data-theme=dark][data-palette=violet]{--gold:#a98bf0;--gold2:#d6c6ff;--on-gold:#120a22;--glow:rgba(169,139,240,.12)}
[data-theme=light][data-palette=violet]{--gold:#6b47c8;--gold2:#9a7ee8;--on-gold:#ffffff;--glow:rgba(107,71,200,.10)}
[data-theme=dark][data-palette=rose]{--gold:#e58fa8;--gold2:#ffc9d8;--on-gold:#26070f;--glow:rgba(229,143,168,.12)}
[data-theme=light][data-palette=rose]{--gold:#b8435f;--gold2:#d97f96;--on-gold:#ffffff;--glow:rgba(184,67,95,.10)}
[data-theme=dark][data-palette=azure]{--gold:#63a8e8;--gold2:#a8d3ff;--on-gold:#03121f;--glow:rgba(99,168,232,.12)}
[data-theme=light][data-palette=azure]{--gold:#1f6bb0;--gold2:#4f97d6;--on-gold:#ffffff;--glow:rgba(31,107,176,.10)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(1000px 500px at 90% -10%,var(--glow),transparent 60%) fixed,var(--bg);color:var(--text);font:15px/1.55 var(--sans);min-height:100vh}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(26px,3.4vw,38px)}h2{font-size:19px}h3{font-size:15px}

button{cursor:pointer;min-height:40px;padding:8px 16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);transition:border-color .15s,background .15s}

button.ico{min-height:32px;width:32px;padding:0;border-color:transparent;background:none;color:var(--muted)}
.link{border:0;background:none;min-height:0;padding:0;color:var(--gold);text-decoration:underline;text-underline-offset:4px;font-size:13px;font-weight:600;cursor:pointer}.link:hover{color:var(--gold2)}

.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.grow{flex:1;min-width:0}.grow b{display:block;font-weight:600;overflow-wrap:break-word}
.ptasks .pill{padding:3px 8px}.ptasks .row{gap:8px}.ptasks .ico{width:28px}.ptasks .grow{min-width:auto}
.row.done .grow b{text-decoration:line-through;color:var(--muted)}

/* ===== bar chart: y-axis, gridlines, month labels ===== */
.bchart{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:8px;animation:chartIn .35s ease-out both}
.byaxis{position:relative;width:58px;height:200px;padding-bottom:24px}

.byaxis span:nth-child(2){top:50%;transform:translateY(-50%)}
.byaxis span:nth-child(3){top:100%;transform:translateY(-100%)}
.bplot{position:relative;height:200px}
.bgrid{position:absolute;left:0;right:0;top:0;bottom:24px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.bgrid span{height:1px;background:var(--line);opacity:.4}
.bgrid span:nth-child(2){opacity:.55}

.bbars{position:absolute;inset:0;display:flex;gap:8px}
.bcol{flex:1;display:flex;flex-direction:column;min-width:0}
.bbar{flex:1;display:flex;align-items:flex-end;gap:3px;justify-content:center}
.bbar i{width:42%;max-width:22px;min-height:2px;border-radius:5px 5px 0 0;background:linear-gradient(180deg,var(--gold2),var(--gold));transition:filter .15s}
.bbar i:hover{filter:brightness(1.12)}

.bcol small{height:24px;display:flex;align-items:center;justify-content:center;font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
@keyframes chartIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chips button[aria-pressed=true]{background:var(--glow);border-color:var(--gold);color:var(--gold)}
.empty{text-align:center;padding:30px 12px;color:var(--muted)}.empty b{display:block;font:500 17px var(--serif);color:var(--text);margin-bottom:6px}
.clock{font:500 clamp(38px,6vw,54px) var(--serif);font-variant-numeric:tabular-nums;margin:6px 0}
.ring-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:12px}
.orbit{width:88px;height:88px;margin:0 auto 8px;border-radius:50%;padding:7px;background:conic-gradient(var(--gold) var(--pct),var(--raise) 0)}
.orbit>div{height:100%;border-radius:50%;background:var(--panel);display:grid;place-items:center}
.orbit strong{font:500 20px var(--serif)}.orbit small{font-size:11px;color:var(--muted)}
.metric{text-align:center}.metric h3{font-size:12px;margin:0 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line)}
.cal-head div{background:var(--raise);padding:8px 2px;text-align:center;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.cal-cell{background:var(--panel);min-height:78px;padding:6px;display:flex;flex-direction:column;gap:3px;border:0;border-radius:0;text-align:left;cursor:pointer;font-weight:400;transition:background .15s}
.cal-cell:hover{background:var(--raise)}.cal-cell.out{opacity:.4}.cal-cell.today .cal-num{background:var(--gold);color:var(--on-gold)}
.cal-num{font-size:12px;font-weight:600;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;flex-shrink:0}
.cal-ev{font-size:10px;padding:1px 4px;border-radius:4px;background:var(--raise);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid var(--gold)}
.cal-ev.t-task{border-left-color:var(--warn)}.cal-ev.t-inv{border-left-color:var(--bad)}.cal-ev.done{text-decoration:line-through;opacity:.55}
.event-card{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.event-card:last-child{border:0}
.event-date{flex-shrink:0;width:52px;text-align:center;background:var(--glow);border-radius:10px;padding:6px 2px;color:var(--gold)}
.event-date .d{font:600 20px var(--serif);line-height:1}.event-date .m{font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-top:2px}
/* ===== donut: crisp SVG strokes + percentages in legend ===== */
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;animation:chartIn .35s ease-out both}
.donut{position:relative;flex-shrink:0}
.donut svg{display:block}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:0 18px}
.donut-center strong{font:600 1.02rem var(--serif);letter-spacing:-.01em;line-height:1.15;overflow-wrap:anywhere}
.donut-center span{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:4px}
.legend{display:flex;flex-direction:column;gap:2px;flex:1;min-width:180px}
.legend>span{display:grid;grid-template-columns:10px 1fr auto auto;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.legend i{width:10px;height:10px;border-radius:3px;display:block}
.legend .lbl{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .pct{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.legend .val{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;text-align:right;min-width:72px}
dialog{width:min(560px,calc(100% - 20px));max-height:90dvh;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--text);box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:auto}
dialog.wide{width:min(860px,calc(100% - 20px))}
dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
dialog>header{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
#db{padding:20px 22px}.foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}.err{color:var(--bad);margin:0 0 10px;font-size:13.5px}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 16px;margin-bottom:16px;border:1px solid var(--gold);border-radius:10px;background:var(--glow)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--on-gold);padding:11px 20px;border-radius:12px;font-weight:600;z-index:99;max-width:calc(100vw - 28px)}
.blur .amt,.blur .stat b,.blur .ring-val,.blur .legend .val,.blur .donut-center strong,.blur .byaxis span,.blur .clock{filter:blur(6px)}
#print{display:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.imgfield{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.imgfield input[type=file]{flex:1;min-width:0;min-height:42px;padding:7px 9px;font-size:12.5px;background:var(--raise)}
.imgprev img{width:58px;height:58px;border-radius:10px;object-fit:cover;border:1px solid var(--line);display:block}
.proj-hero{position:relative;margin:-20px -20px 14px;height:150px;border-radius:var(--r) var(--r) 0 0;overflow:hidden;background:var(--raise)}
.proj-hero img{width:100%;height:100%;object-fit:cover;display:block}
.proj-hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg, rgba(0,0,0,.28) 0%, rgba(0,0,0,0) 38%, color-mix(in srgb,var(--panel) 82%,transparent) 78%, var(--panel) 100%);}
[data-theme=light] .proj-hero::after{background:linear-gradient(180deg, rgba(0,0,0,.16) 0%, rgba(0,0,0,0) 36%, color-mix(in srgb,var(--panel) 86%,transparent) 80%, var(--panel) 100%);}
.proj-hero .hero-title{position:absolute;left:20px;right:20px;bottom:8px;z-index:2;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.proj-hero .hero-title h2{font-size:20px;line-height:1.15;text-shadow:0 1px 12px rgba(0,0,0,.45)}
[data-theme=light] .proj-hero .hero-title h2{text-shadow:0 1px 8px rgba(255,255,255,.75)}
.card.proj{border:1px solid transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(150deg,color-mix(in srgb,var(--gold) 85%,transparent),color-mix(in srgb,var(--gold) 18%,var(--line)) 38%,var(--line) 62%,color-mix(in srgb,var(--gold) 60%,transparent)) border-box;box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 6%,transparent),0 22px 44px -26px rgba(0,0,0,.75);transition:transform .25s ease,box-shadow .25s ease}
.card.proj:hover{transform:translateY(-3px);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 12%,transparent),0 30px 60px -28px color-mix(in srgb,var(--gold) 38%,rgba(0,0,0,.8))}
.card.proj .proj-hero{margin:-19px -19px 14px;border-radius:calc(var(--r) - 1px) calc(var(--r) - 1px) 0 0}
.ptasks{margin-top:12px;padding-top:6px;border-top:1px solid var(--line)}
.ptasks>header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
.ptasks h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
/* ===== asset download row ===== */

@media(max-width:800px){.app{display:block}aside{position:sticky;height:auto;z-index:5;flex-direction:row;align-items:center;padding:10px 12px;border:0;border-bottom:1px solid var(--line);backdrop-filter:blur(12px);background:color-mix(in srgb,var(--panel) 92%,transparent)}.brand span{display:none}nav{display:flex;overflow-x:auto;scrollbar-width:none}nav a{white-space:nowrap}.two{grid-template-columns:1fr}.cal-cell{min-height:64px}}
@media print{body>*:not(#print){display:none!important}#print{display:block;color:#000;background:#fff;padding:24px;font-family:var(--sans)}#print table{width:100%;border-collapse:collapse;margin:28px 0}#print td,#print th{padding:10px 0;border-bottom:1px solid #ccc;text-align:left}#print .r{text-align:right}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body>
<div class="app">
<aside>
  <div class="brand"><i></i><span>CalmStudio Desk</span></div>
  <nav id="nav" aria-label="Main"></nav>
</aside>
<main>
  <div class="top"><h1 id="title"></h1><div class="acts" id="acts"></div></div>
  <div id="banner"></div>
  <div id="view"></div>
</main>
</div>
<dialog id="dlg" aria-labelledby="dt"><header><h2 id="dt"></h2><button class="ico" data-act="close" aria-label="Close">✕</button></header><div id="db"></div></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="imp" accept="application/json,.json" hidden>
<div id="print"></div>
<script>
"use strict";


const CONFIG = {
  IMG_MAX_BYTES:   8e6,
  IMG_MAX_DIM:     1400,
  IMG_QUALITY:     0.85,
  BACKUP_MAX_BYTES:1e7,
  RECUR_CAP:       400,
  TOAST_MS:        3800
};

const $=(s,r=document)=>r.querySelector(s);
const E=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const iso=(d=new Date())=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const shift=(s,n,u="d")=>{const d=new Date(s+"T00:00");if(u==="m"){const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}else d.setDate(d.getDate()+n);return iso(d)};
const dayDiff=(a,b)=>Math.round((Date.parse(b+"T00:00Z")-Date.parse(a+"T00:00Z"))/864e5);
const fdate=s=>s?new Date(s+"T00:00").toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}):"—";

function norm(r){
  const b=blank(),s={...b,...r,settings:{...b.settings,...(r.settings||{})}};
  if(!PALETTES[s.settings.palette])s.settings.palette="gold";
  if(s.settings.theme!=="light")s.settings.theme="dark";
  if(s.settings.motion===undefined)s.settings.motion=true;
  const okId=v=>typeof v==="string"&&/^[A-Za-z0-9_-]{1,64}$/.test(v),ref=v=>okId(v)?v:"",str=v=>typeof v==="string"?v:v==null?"":String(v),num=v=>{v=Math.round(+v);return Number.isFinite(v)&&v>0?v:0};
  COLS.forEach(k=>{s[k]=(Array.isArray(s[k])?s[k]:[]).filter(x=>x&&typeof x==="object").map(x=>({...x,id:okId(x.id)?x.id:uid()}))});
  const sd=s.settings;sd.business=str(sd.business).slice(0,250)||"My Studio";sd.email=str(sd.email);sd.details=str(sd.details);
  if(!CUR.includes(sd.currency))sd.currency="USD";sd.taxRate=Math.min(100,Math.max(0,+sd.taxRate||0));
  ["clients","projects","invoices","expenses","tasks","events"].forEach(k=>s[k].forEach(x=>{x.name=str(x.name)}));
  ["projects","invoices"].forEach(k=>s[k].forEach(x=>{x.clientId=ref(x.clientId||(x.clientIds||[])[0])}));
  ["tasks","expenses","entries"].forEach(k=>s[k].forEach(x=>{x.projectId=ref(x.projectId)}));
  ["due","issued"].forEach(f=>[...s.projects,...s.invoices,...s.tasks].forEach(x=>{if(f in x)x[f]=str(x[f])}));
  s.events.forEach(e=>{e.date=str(e.date);e.time=str(e.time)});s.expenses.forEach(x=>{x.date=str(x.date);x.amount=num(x.amount)});
  s.entries.forEach(x=>{x.date=str(x.date);x.seconds=num(x.seconds)});s.projects.forEach(p=>{p.budget=num(p.budget)});
  s.invoices.forEach(i=>{i.number=str(i.number);i.amount=num(i.amount)});
  if(s.timer&&(typeof s.timer!=="object"||!Number.isFinite(+s.timer.start)))s.timer=null;else if(s.timer){s.timer.projectId=ref(s.timer.projectId);s.timer.start=+s.timer.start}
  s.projects.forEach(p=>{p.clientId=p.clientId||(p.clientIds||[])[0]||"";delete p.clientIds;p.image=p.image||""});
  s.invoices.forEach(i=>{i.payments=(Array.isArray(i.payments)?i.payments:[]).filter(p=>p&&typeof p==="object").map(p=>({id:okId(p.id)?p.id:uid(),amount:num(p.amount),date:str(p.date)}));i.desc=str(i.desc||i.description)});
  s.tasks.forEach(t=>{
    if(!["none","daily","weekly","biweekly","monthly","yearly"].includes(t.repeat))
      t.repeat=["daily","weekly","biweekly","monthly","yearly"].includes(t.recurrence)?t.recurrence:"none";
    t.doneAt=t.doneAt||t.completedAt||null;t.done=!!t.done;if(!PRIOS.includes(t.priority))t.priority="Medium";
  });
  s.events.forEach(e=>{if(!RECS[e.recurrence])e.recurrence="none"});
  return s;
}

function nextOcc(d,rec){
  if(!d||!rec||rec==="none")return null;
  switch(rec){case"daily":return shift(d,1);case"weekly":return shift(d,7);case"biweekly":return shift(d,14);case"monthly":return shift(d,1,"m");case"yearly":return shift(d,12,"m");default:return null}
}
const STEP_D={daily:1,weekly:7,biweekly:14},STEP_M={monthly:1,yearly:12};
function expandRec(start,rec,from,to){
  const out=[];if(!start||from>to)return out;
  if(!STEP_D[rec]&&!STEP_M[rec]){if(start>=from&&start<=to)out.push(start);return out}
  if(STEP_D[rec]){
    const st=STEP_D[rec];let k=Math.max(0,Math.ceil(dayDiff(start,from)/st));
    for(let d=shift(start,k*st);d<=to&&out.length<CONFIG.RECUR_CAP;d=shift(start,++k*st))out.push(d);
  }else{
    const st=STEP_M[rec],a=start.split("-"),b=from.split("-");
    let k=Math.max(0,Math.floor(((b[0]-a[0])*12+(b[1]-a[1]))/st)-1);
    for(let d=shift(start,k*st,"m");d<=to&&out.length<CONFIG.RECUR_CAP;d=shift(start,++k*st,"m"))if(d>=from)out.push(d);
  }
  return out;
}
const nextOn=e=>expandRec(e.date,e.recurrence,iso(),shift(iso(),731))[0]||null;

function shrink(file){
  return new Promise((ok,no)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      try{
        const max=CONFIG.IMG_MAX_DIM;
        const s=Math.min(1,max/Math.max(img.naturalWidth||1,img.naturalHeight||1));
        const w=Math.max(1,Math.round((img.naturalWidth||max)*s)),h=Math.max(1,Math.round((img.naturalHeight||max)*s));
        const c=document.createElement("canvas");c.width=w;c.height=h;
        const x=c.getContext("2d");
        x.fillStyle="#fff";x.fillRect(0,0,w,h);
        x.drawImage(img,0,0,w,h);
        ok(c.toDataURL("image/jpeg",CONFIG.IMG_QUALITY));
      }catch(err){no(Error("Could not process that image."))}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);no(Error("That file isn't a readable image."))};
    img.src=url;
  });
}

function barTrend(months){
  if(!months.length)return`<p class="muted">No data.</p>`;
  const max=Math.max(1,...months.flatMap(m=>[m.a,m.b])),showOut=months.some(m=>m.b>0);
  const cols=months.map(m=>`<div class="bcol">
    <div class="bbar">
      <i style="height:${Math.max(1.5,m.a/max*100)}%" title="In ${fm(m.a)}"></i>
      ${showOut?`<i class="o" style="height:${Math.max(1.5,m.b/max*100)}%" title="Out ${fm(m.b)}"></i>`:""}
    </div>
    <small>${E(m.l)}</small>
  </div>`).join("");
  return `<div class="bchart" role="img" aria-label="${showOut?"Cash in versus out":"Cash collected"}, ${months.length} months">
    <div class="byaxis"><span>${fm(max)}</span><span>${fm(max/2)}</span><span>0</span></div>
    <div class="bplot">
      <div class="bgrid"><span></span><span></span><span></span></div>
      <div class="bbars">${cols}</div>
    </div>
  </div>`;
}
function donut(segs,title,sub,size=170,thick=26){
  const data=(segs||[]).filter(s=>s.value>0),total=sum(data,s=>s.value);
  if(!total)return`<p class="muted small">No data.</p>`;
  const cx=size/2,cy=size/2,r=(size-thick)/2,C=2*Math.PI*r;
  let off=0;
  const arcs=data.map(s=>{
    const frac=s.value/total,len=C*frac;
    const el=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${thick}" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"><title>${E(s.label)} — ${E(s.fmt||fm(s.value))} · ${Math.round(frac*100)}%</title></circle>`;
    off+=len;
    return el;
  }).join("");
  const leg=data.map(s=>{
    const p=Math.round(s.value/total*100);
    return `<span><i style="background:${s.color}"></i><span class="lbl">${E(s.label)}</span><span class="pct">${p}%</span><span class="val">${E(s.fmt||fm(s.value))}</span></span>`;
  }).join("");
  return `<div class="donut-wrap">
    <div class="donut" style="width:${size}px;height:${size}px">
      <svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--raise)" stroke-width="${thick}"/>
        ${arcs}
      </svg>
      <div class="donut-center"><strong>${E(title)}</strong><span>${E(sub)}</span></div>
    </div>
    <div class="legend">${leg}</div>
  </div>`;
}

function input([k,l,t="text",req,opts],v){
  let el;
  if(t==="select"){
    const o=opts||[];
    const labels=k==="repeat"||k==="recurrence"?RECS:{};
    el=`<select name="${k}">${o.map(x=>`<option value="${E(x)}" ${x===v?"selected":""}>${E(labels[x]||x)}</option>`).join("")}</select>`;
  }else if(t.startsWith("ref:")){
    const c=t.slice(4);
    el=`<select name="${k}" ${req?"required":""}><option value="">${req?"Choose…":"None"}</option>${S[c].map(x=>`<option value="${E(x.id)}" ${x.id===v?"selected":""}>${E(x.name||x.number)}</option>`).join("")}</select>`;
  }else if(t==="textarea")el=`<textarea name="${k}" rows="3" maxlength="3000">${E(v)}</textarea>`;
  else if(t==="image"){
    el=`<div class="imgfield">
      <input type="hidden" name="${k}" value="${E(v||"")}">
      <input type="file" accept="image/*" class="imgpick" aria-label="${E(l)}">
      <div class="imgprev">${v?`<img src="${E(v)}" alt="">`:""}</div>
      <button type="button" class="ico imgclear" data-act="imgclear" ${v?"":"hidden"} aria-label="Remove image">✕</button>
    </div>`;
  }else{
    const num=t==="money"||t==="number";
    el=`<input name="${k}" type="${num?"number":t}" ${num?'step="0.01" min="0"':'maxlength="250"'} value="${E(v)}" ${req?"required":""}>`;
  }
  return`<label>${l}${req?" *":""}${el}</label>`;
}

function edit(col,id,preset={}){
  const sc=SCH[col],rec=S[col].find(r=>r.id===id),v={...DEF[col](),...rec,...preset};
  sc.f.forEach(([k,,t])=>{if(t==="money")v[k]=v[k]?v[k]/100:""});
  if(col==="entries")v.hours=v.seconds?+(v.seconds/3600).toFixed(3):"";
  openDlg((id?"Edit ":"New ")+sc.one,sc.f.map(f=>input(f,v[f[0]])).join(""),d=>{
    sc.f.forEach(([k,,t])=>{if(t==="money")d[k]=Math.round(parseFloat(d[k]||0)*100)});
    if(col==="entries"){d.seconds=Math.round(d.hours*3600);delete d.hours;if(d.seconds<1)throw Error("Enter at least a few seconds.")}
    if(col==="invoices"){
      d.number=d.number.trim();if(!d.number)throw Error("Enter an invoice number.");
      if(d.due<d.issued)throw Error("Due date must be on or after the issue date.");
      if(d.amount<1)throw Error("Enter an amount above zero.");
      if(S.invoices.some(i=>i.id!==id&&i.number.toLowerCase()===d.number.trim().toLowerCase()))throw Error("That invoice number is already used.");
      if(rec&&d.amount<paid(rec))throw Error("Total can't be lower than payments already recorded.");
    }
    if(col==="expenses"&&d.amount<1)throw Error("Enter an amount above zero.");
    if(col==="events"&&!d.name.trim())throw Error("Enter an event name.");
    if(rec)Object.assign(rec,d);else S[col].push({...DEF[col](),...d,id:uid()});
  });
}

function taskRow(t,opt={}){

calendar(){
  const anchor=calAnchor,y=new Date(anchor+"T00:00").getFullYear(),m=new Date(anchor+"T00:00").getMonth();
  const first=iso(new Date(y,m,1)),gridStart=weekStart(first,0);
  const cells=[];
  for(let i=0;i<42;i++){
    const d=shift(gridStart,i),outside=new Date(d+"T00:00").getMonth()!==m;
    const t=tasksOn(d).filter(x=>!x.done),e=eventsOn(d),inv=invsDueOn(d);

function ringPct(p,label,val,sub){
  const n=Math.max(0,Math.min(100,p||0));

}

const TITLES={overview:"Studio at a glance",calendar:"Calendar",tasks:"To-dos",projects:"Projects",clients:"Clients",invoices:"Invoices",events:"Events",time:"Time",tax:"Tax reserve",settings:"Settings"};

    <button data-act="export">Export</button>

  $("#view").innerHTML=V[view]();tick();
}
function tick(){const c=$("#clock");if(c&&S.timer){const s=Math.max(0,Math.floor((Date.now()-S.timer.start)/1e3));c.textContent=[s/3600|0,s%3600/60|0,s%60].map(n=>String(n).padStart(2,"0")).join(":")}}
setInterval(tick,1000);
function pingBrand(){
  const dot=$(".brand i");if(!dot)return;
  dot.classList.remove("ping");void dot.offsetWidth;dot.classList.add("ping");
  clearTimeout(pingBrand._t);pingBrand._t=setTimeout(()=>dot.classList.remove("ping"),700);
}
const dl=(txt,file,type)=>{
  const u=URL.createObjectURL(new Blob([txt],{type}));
  saveBlobURL(u,file);
  setTimeout(()=>URL.revokeObjectURL(u),1e4);
};
const ask=(m,fn,opts)=>confirmDlg(m,()=>{fn();save();render()},opts);

const A={
  close:()=>$("#dlg").close(),
  edit:(id,col,el)=>{
    const preset={};
    if(el?.dataset?.presetDue)preset.due=el.dataset.presetDue;
    if(el?.dataset?.presetDate)preset.date=el.dataset.presetDate;
    if(el?.dataset?.presetProject)preset.projectId=el.dataset.presetProject;
    edit(col,id,preset);
  },
  pay,print:printInv,
  tf:id=>{tf=id;render()},
  theme:()=>{S.settings.theme=S.settings.theme==="light"?"dark":"light";save();render()},
  blur:()=>document.body.classList.toggle("blur"),
  hidebanner:()=>{bannerHidden=true;try{localStorage.setItem(BKEY,"1")}catch(e){};render()},
  imgclear:(id,col,el)=>{
    const field=el.closest(".imgfield");if(!field)return;
    field.querySelector('input[type="hidden"]').value="";
    field.querySelector(".imgprev").innerHTML="";
    el.hidden=true;
  },
  day:id=>dayModal(id),
  "cal-prev":()=>{calAnchor=shift(monthStart(calAnchor),-1,"m");render()},
  "cal-next":()=>{calAnchor=shift(monthStart(calAnchor),1,"m");render()},
  "cal-today":()=>{calAnchor=iso();render()},
  toggle:id=>{
    const t=S.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;t.doneAt=t.done?iso():null;
    if(!t.done&&t.nextId){S.tasks=S.tasks.filter(x=>!(x.id===t.nextId&&!x.done));delete t.nextId}
    if(t.done&&t.repeat&&t.repeat!=="none"&&t.due){
      const n=nextOcc(t.due,t.repeat);
      if(n&&!S.tasks.some(x=>x.name===t.name&&x.due===n&&x.projectId===t.projectId&&!x.done)){
        const nt={...t,id:uid(),done:false,doneAt:null,due:n};delete nt.nextId;t.nextId=nt.id;S.tasks.push(nt);
        toast("Next one scheduled for "+fdate(n)+".");
      }
    }
    save();render();
  },
  del:(id,col)=>{
    if(col==="clients"&&(S.projects.some(p=>p.clientId===id)||S.invoices.some(i=>i.clientId===id)))return toast("This client still has projects or invoices.");
    if(col==="projects"&&(S.timer&&S.timer.projectId===id))return toast("Stop the running timer for this project first.");
    ask("Delete this "+SCH[col].one+"? This can't be undone.",()=>{
      S[col]=S[col].filter(x=>x.id!==id);
      if(col==="projects")["tasks","expenses","entries"].forEach(k=>S[k].forEach(x=>{if(x.projectId===id)x.projectId=""}));
    },{title:"Delete "+SCH[col].one,yes:"Delete"});
  },
  start:()=>{S.timer={projectId:$("#tp").value,note:$("#tn").value.slice(0,250),start:Date.now()};save();render()},
  stop:()=>{
    const t=S.timer,s=Math.max(1,Math.round((Date.now()-t.start)/1e3));
    S.entries.push({id:uid(),projectId:t.projectId,note:t.note,date:iso(new Date(t.start)),seconds:s});
    S.timer=null;save();render();toast("Time saved.");
  },
  discard:()=>ask("Discard this timer? The time won't be saved.",()=>{S.timer=null},{yes:"Discard"}),
  export:()=>{
    const snap={...S,lastBackup:new Date().toISOString()};
    dl(JSON.stringify(snap,null,2),`calmstudio-desk-${real?"sample-":""}backup-${iso()}.json`,"application/json");
    if(!real){S.lastBackup=snap.lastBackup;save();render()}
    toast("Backup downloaded.");
  },
  import:()=>real?toast("Leave the sample workspace before restoring."):$("#imp").click(),
  demo:()=>{if(real){S=real;real=null}else{real=S;S=sample()}view="overview";location.hash="overview";render()},
  erase:()=>ask("Erase everything in this workspace? Export a backup first if you need one.",()=>{
    const th=S.settings.theme,pa=S.settings.palette,mo=S.settings.motion;
    S=blank();S.settings.theme=th;S.settings.palette=pa;S.settings.motion=mo;
  },{title:"Erase all data",yes:"Erase"}),


};

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  const{act,id,col}=t.dataset;
  try{A[act]&&A[act](id,col,t)}catch(x){toast(x.message)}
});
document.addEventListener("change",e=>{
  if(e.target.id==="palSel"){
    S.settings.palette=PALETTES[e.target.value]?e.target.value:"gold";
    save();render();
  }
});
$("#db").addEventListener("change",async e=>{
  const f=e.target;
  if(!f.classList||!f.classList.contains("imgpick"))return;
  const file=f.files&&f.files[0];if(!file)return;
  try{
    if(!/^image\//.test(file.type))throw Error("Choose an image file.");
    if(file.size>CONFIG.IMG_MAX_BYTES)throw Error("Image is larger than "+Math.round(CONFIG.IMG_MAX_BYTES/1e6)+" MB.");
    const data=await shrink(file);
    const field=f.closest(".imgfield");
    field.querySelector('input[type="hidden"]').value=data;
    field.querySelector(".imgprev").innerHTML=`<img src="${data}" alt="">`;
    const clr=field.querySelector(".imgclear");if(clr)clr.hidden=false;
  }catch(x){toast(x.message)}
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="set")return;e.preventDefault();
  const d=Object.fromEntries(new FormData(e.target)),r=parseFloat(d.taxRate);
  if(!d.business.trim())return toast("Enter a business name.");
  if(!(r>=0&&r<=100))return toast("Tax rate must be between 0 and 100.");
  if(!PALETTES[d.palette])d.palette=S.settings.palette;
  if(d.theme!=="light")d.theme="dark";
  d.motion=(d.motion==="on");
  S.settings={...S.settings,...d,business:d.business.trim(),taxRate:r};
  save();render();toast("Saved.");
});
$("#imp").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{
    if(f.size>CONFIG.BACKUP_MAX_BYTES)throw Error("Backup is larger than "+Math.round(CONFIG.BACKUP_MAX_BYTES/1e6)+" MB.");
    const r=JSON.parse(await f.text());
    if(!r||!r.settings||!CUR.includes(r.settings.currency))throw Error("That isn't a CalmStudio Desk backup.");
    ask("Replace this workspace with the backup?",()=>{S=norm(r)},{title:"Restore backup",yes:"Replace"});
  }catch(x){toast(x instanceof SyntaxError?"That file isn't valid JSON.":x.message)}
};
$("#dlg").addEventListener("click",e=>{if(e.target.id==="dlg")A.close()});
