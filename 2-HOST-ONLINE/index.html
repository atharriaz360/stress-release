  if(button)button.disabled=true;
  try{
    var paper=document.querySelector('#paper');
    if(!paper){toast('Open the resume preview first');return}
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    var mint=paper.classList.contains('tpl-mint');
    var styles=Array.from(document.querySelectorAll('style')).map(function(s){return s.textContent}).join('\n');
    var layout=getComputedStyle(paper);
    var top=mint?getComputedStyle(paper.querySelector('.resume-header')).paddingTop:layout.paddingTop;
    var pagePadding=[top,layout.paddingRight,layout.paddingBottom,layout.paddingLeft].join(' ');
    var bandWidth=layout.borderTopWidth;
    var accent=layout.getPropertyValue('--rc').trim()||'#0d9488';
    var band=mint?'color-mix(in srgb,'+accent+' 23%,white)':'transparent';
    var frame=document.createElement('iframe');
    frame.title='Resume PDF';frame.setAttribute('aria-hidden','true');
    // Keep a real, full-width layout: display:none produces blank printouts.
    frame.style.cssText='position:fixed;left:-10000px;top:0;width:794px;height:1123px;border:0;pointer-events:none';
    document.body.appendChild(frame);resumePrintFrame=frame;
    var doc=frame.contentDocument;
    doc.open();doc.write('<!doctype html><html><head><meta charset="utf-8"><title>'+E(resumeName()+'_resume')+'</title><style>'+styles+'</style></head><body>'+paper.outerHTML+'<\/body><\/html>');doc.close();
    var printStyle=doc.createElement('style');
    // No printer margins: Chrome has no margin area for its URL/date footer.
    // Clone the resume's own border and padding at each page fragment instead.
    printStyle.textContent='@page{size:794px 1123px;margin:0}'
      +'html,body{margin:0!important;padding:0!important;background:white!important;color:#111!important;width:auto!important;min-height:0!important}'
      +'*,*::before,*::after{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}'
      +'#paper{zoom:1!important;width:794px!important;max-width:none!important;min-height:0!important;margin:0!important;padding:'+pagePadding+'!important;border:0!important;border-radius:0!important;box-shadow:none!important;overflow:visible!important;-webkit-box-decoration-break:clone!important;box-decoration-break:clone!important}'
      +(mint?'#paper.tpl-mint{border-top:'+bandWidth+' solid '+band+'!important}#paper.tpl-mint .resume-header{padding-top:0!important}':'')
      +'#paper .resume-columns td{padding-top:var(--resume-row-gap)!important;padding-bottom:var(--resume-row-gap)!important}'
      +'#paper .resume-left{padding-right:var(--resume-left-gap)!important}'
      +'#paper .resume-right{padding-left:var(--resume-right-gap)!important}'
      +'#paper h2{break-after:avoid;page-break-after:avoid}'
      +'#paper .job-head,#paper .job>.meta,#paper .job>.sub{break-after:avoid;page-break-after:avoid}'
      +'#paper .job{break-inside:avoid;page-break-inside:avoid}'
      +'#paper p,#paper li{orphans:2;widows:2}'
      +'#paper section{break-inside:auto}';
    doc.head.appendChild(printStyle);
    if(doc.fonts&&doc.fonts.ready)await doc.fonts.ready;
    await new Promise(function(resolve){frame.contentWindow.requestAnimationFrame(function(){frame.contentWindow.requestAnimationFrame(resolve)})});
    var originalTitle=document.title;document.title=resumeName()+'_resume';
    var cleanup=function(){if(resumePrintFrame===frame){frame.remove();resumePrintFrame=null;document.title=originalTitle}};
    frame.contentWindow.addEventListener('afterprint',cleanup,{once:true});
    toast('Choose Save as PDF. Keep scale at 100%.');
    frame.contentWindow.focus();frame.contentWindow.print();
    // Some browsers do not emit afterprint for child frames. The dialog is
    // normally blocking; retain the frame briefly for engines that print later.
    setTimeout(cleanup,60000);
  }catch(e){console.error('Resume PDF failed',e);if(resumePrintFrame){resumePrintFrame.remove();resumePrintFrame=null}toast('Could not open PDF printing. Please try again.')}
  finally{if(button)button.disabled=false}
}

{g:"Getting Started",id:"s1",title:"Your first week",body:"<p>Three practical steps for your next career move:</p><ul><li><b>Fill the Experience Bank completely.</b> Relevant jobs, projects, volunteering, and training.</li><li><b>Add 6–8 strong bullets with numbers.</b> \"Helped with event\" → \"Ran event for 120 students, raised $3,400.\"</li><li><b>Set up 3–5 applications in the Job Tracker.</b> Wishlist is fine.</li></ul>"},

{g:"Getting Started",id:"s3",title:"No internship? Add these",body:"<ul><li>Class projects — especially team ones</li><li>Hackathons and case competitions</li><li>Clubs, sports, student government</li><li>Part-time jobs — customer service is real experience</li><li>Freelance, tutoring, volunteering</li><li>Personal projects with users (even 20 users counts)</li></ul>"},
{g:"The 12 Rules",id:"r1",title:"1 · Research before you apply",body:"<p>Know four things: what the company sells, what changed there recently, who your interviewer is, and what problem the role solves.</p><ul><li>Read the last two blog posts.</li><li>Look up interviewer on LinkedIn.</li><li>Write one sentence: <em>\"This role exists because ______.\"</em></li></ul>"},

{g:"The 12 Rules",id:"r4",title:"4 · Quantify everything",body:"<p>\"Improved onboarding\" is invisible. \"Cut onboarding 14 to 3, saved 40 hours monthly\" gets you hired.</p><ul><li>Numbers you know — use them.</li><li>Numbers you don't — estimate and say so.</li><li>%, time, revenue, users, tickets. Pick a unit.</li></ul>"},

{g:"The 12 Rules",id:"r6",title:"6 · Ask better questions than you answer",body:"<ul><li>What does success look like at 90 days?</li><li>What's the biggest risk to that?</li><li>How are decisions made when the team disagrees?</li><li>What happened to the last person in this role?</li><li>Based on our chat, anything about my background I should clarify?</li></ul>"},
{g:"The 12 Rules",id:"r7",title:"7 · Never badmouth a past employer",body:"<p>Reframe every negative into a preference.</p><blockquote>\"Team was chaotic\" → \"I do best where priorities are written down, so I ask for that early.\"</blockquote>"},
{g:"The 12 Rules",id:"r8",title:"8 · Don't name a number first",body:"<p>Whoever anchors first usually loses. Deflect once, politely.</p><blockquote>\"I'd rather understand the scope first — what range is budgeted?\"</blockquote>"},
{g:"The 12 Rules",id:"r9",title:"9 · Close every interview",body:"<blockquote>\"What are the next steps, and is there anything about my background I can clarify?\"</blockquote><p>Then send a thank-you note same day.</p>"},
{g:"The 12 Rules",id:"r10",title:"10 · Same-day thank-you, with substance",body:"<p>Three sentences: a specific moment, one extra proof point, next step.</p>"},
{g:"The 12 Rules",id:"r11",title:"11 · Treat rejection as data",body:"<ul><li><b>No screen</b> → resume needs work</li><li><b>No first round</b> → pitch or salary talk</li><li><b>No final round</b> → story depth</li><li><b>No offer after final</b> → closing or references</li></ul><p>One lesson per rejection. Then move on.</p>"},
{g:"The 12 Rules",id:"r12",title:"12 · Follow up politely, relentlessly",body:"<p>Silence isn't a no — it's a queue. Calm, spaced cadence beats luck.</p>"},
{g:"Frameworks",id:"star",title:"STAR — Situation, Task, Action, Result",body:"<ul><li><b>Situation</b> — one sentence of context.</li><li><b>Task</b> — what you were on the hook for.</li><li><b>Action</b> — three or four sentences. Say \"I\", not \"we\".</li><li><b>Result</b> — the number. Bonus: what you'd do differently.</li></ul><p><b>Time:</b> 15s situation · 60s action · 15s result.</p>"},
{g:"Frameworks",id:"bank",title:"Six stories cover everything",body:"<ul><li>Biggest win</li><li>Biggest failure</li><li>Conflict with a peer</li><li>Led without authority</li><li>Worked through ambiguity</li><li>Changed someone's mind with data</li></ul>"},
{g:"Frameworks",id:"weak",title:"'What's your weakness?'",body:"<p>Pick something real, not fatal to the role. Show the system you built.</p><blockquote>\"I used to over-index on details and slow delivery. I now timebox exploration and force a decision at the end.\"</blockquote>"},
{g:"Negotiation",id:"n1",title:"Never accept on the call",body:"<blockquote>\"Thank you — I'm excited. Can I have 48 hours to review the full package?\"</blockquote><p>Enthusiasm plus a pause isn't rejection.</p>"},
{g:"Negotiation",id:"n2",title:"The counter script",body:"<blockquote>\"Based on the scope and what I'm seeing for this level, I was expecting [X]. If we can get there on base, I'm ready to sign today.\"</blockquote><p>Then stop talking.</p>"},
{g:"Negotiation",id:"n3",title:"Non-salary levers",body:"<ul><li>Sign-on bonus</li><li>Equity or refresh</li><li>Remote days</li><li>Start date</li><li>Learning budget or conference</li><li>Early review at 6 months</li></ul>"},
{g:"Networking",id:"co1",title:"How to write a cold LinkedIn message",body:"<p>Three sentences. Short.</p><blockquote>\"Hi [Name] — I'm a [year] student at [school] exploring [field]. Saw your path from [school] to [company]. Would you be open to a 15-min chat about your work? Happy to work around your schedule.\"</blockquote><p>No attachments. No long story. No ask for a referral on the first message.</p>"},
{g:"Networking",id:"co2",title:"The coffee chat template",body:"<ul><li><b>0–2 min</b> — thank them, give your 30-sec background.</li><li><b>2–10 min</b> — ask about their path, current work, what surprised them.</li><li><b>10–14 min</b> — ask what they'd do if they were you.</li><li><b>14–15 min</b> — thank them, ask if you can follow up in a few months.</li></ul><p>Then send a thank-you note within 24 hours.</p>"}
];

var NAV=[["hub","Hub","i-hub"],["bank","Experience Bank","i-bank"],["resume","Resume Builder","i-resume"],["jobs","Job Tracker","i-jobs"],["contacts","Contacts","i-contacts"],["playbook","Playbook","i-playbook"],["settings","Settings","i-settings"]];
var TITLES={};NAV.forEach(function(n){TITLES[n[0]]=n[1]});
var appearanceOpen=false;
var ACCENT_COLORS={indigo:'#4f46e5',emerald:'#10b981',amber:'#f59e0b',rose:'#f43f5e',slate:'#64748b'};
function modeIcon(kind){var paths={sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>',moon:'<path d="M20.5 14a8.5 8.5 0 0 1-10.5-10.5A8.5 8.5 0 1 0 20.5 14Z"/>',focus:'<path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/><circle cx="12" cy="12" r="3"/>',palette:'<circle cx="12" cy="12" r="9"/><circle cx="8" cy="9" r=".7"/><circle cx="13" cy="7" r=".7"/><circle cx="17" cy="11" r=".7"/><path d="M11 21v-4a2 2 0 0 1 2-2h3"/>'};return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+paths[kind]+'</svg>'}
function renderAppearance(){var host=document.querySelector('#appearance');if(!host)return;var dark=S.settings.theme==='dark';host.innerHTML=
'<button class="mode-button" data-act="theme-toggle" aria-label="Switch to '+(dark?'light':'dark')+' mode" title="Switch to '+(dark?'light':'dark')+' mode">'+modeIcon(dark?'sun':'moon')+'</button>'+
'<button class="mode-button appearance-trigger" data-act="appearance-toggle" aria-label="Choose accent color" title="Accent: '+E(ACCENTS[S.settings.accent])+'" aria-expanded="'+appearanceOpen+'" aria-controls="appearance-panel">'+modeIcon('palette')+'<span class="accent-dot" style="background:'+ACCENT_COLORS[S.settings.accent]+'"></span></button>'+
'<button class="mode-button" data-act="focus-toggle" aria-label="'+(S.settings.focus?'Show navigation':'Hide navigation')+'" title="Focus mode" aria-pressed="'+S.settings.focus+'">'+modeIcon('focus')+'</button>'+
'<div id="appearance-panel" class="appearance-panel" '+(appearanceOpen?'':'hidden')+'><div class="appearance-heading"><strong>Accent color</strong><span>'+E(ACCENTS[S.settings.accent])+'</span></div><div class="accent-options">'+Object.keys(ACCENTS).map(function(k){var selected=k===S.settings.accent;return '<button class="accent-option" data-act="accent-set" data-id="'+k+'" aria-label="'+E(ACCENTS[k])+' accent" aria-pressed="'+selected+'"><span class="accent-circle" style="--swatch:'+ACCENT_COLORS[k]+'">'+(selected?'<svg viewBox="0 0 24 24" fill="none" stroke="'+(k==='amber'?'#1f2937':'white')+'" stroke-width="2.5" aria-hidden="true"><path d="m6 12 4 4 8-8"/></svg>':'')+'</span><span>'+E(ACCENTS[k])+'</span></button>'}).join('')+'</div><p>Changes save automatically.</p></div>'}
function closeAppearance(returnFocus){appearanceOpen=false;var panel=document.querySelector('#appearance-panel'),trigger=document.querySelector('[data-act=appearance-toggle]');if(panel)panel.hidden=true;if(trigger){trigger.setAttribute('aria-expanded','false');if(returnFocus)trigger.focus()}}
function setAppearance(key,value){S.settings[key]=value;save();render();var selector=key==='theme'?'[data-act=theme-toggle]':key==='focus'?'[data-act=focus-toggle]':'[data-act=accent-set][data-id="'+value+'"]';var b=document.querySelector(selector);if(b)b.focus()}
document.addEventListener('click',function(e){if(appearanceOpen&&!e.target.closest('#appearance'))closeAppearance(false)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&appearanceOpen){closeAppearance(true);e.preventDefault()}});

var ADD={
bank:function(){if(bankTab==="profile")return null;var m={experiences:"Role",projects:"Project",education:"Education",certs:"Certification",skills:"Skill group"};return[bankTab,m[bankTab]]},
jobs:function(){return["applications","Application"]},
contacts:function(){return["contacts","Contact"]}
};

function render(){
var el=document.documentElement;
el.dataset.theme=S.settings.theme;el.dataset.accent=S.settings.accent;
if(S.settings.focus)el.dataset.focus="true";else delete el.dataset.focus;
$("#nav").innerHTML=NAV.map(function(n){return '<a href="#'+n[0]+'" '+(n[0]===view?'aria-current="page"':"")+'><svg class="ic" aria-hidden="true"><use href="#'+n[2]+'"/></svg>'+n[1]+'</a>'}).join("");
$("#title").textContent=TITLES[view]||"Hub";
var a=ADD[view]?ADD[view]():null;
$("#acts").innerHTML=a?'<button class="primary" data-act="new" data-col="'+a[0]+'">+ '+a[1]+'</button>':"";
var html=V[view]();
$("#view").innerHTML=(sampleMode&&!bannerHidden)?'<div class="banner" id="sample-banner">Sample data — nothing saved. Refresh to clear.<button data-act="sample">Exit sample</button><button data-act="hide-banner">Hide</button></div>'+html:html;
var r=readiness();
$("#sidefoot").innerHTML=S.badges.length?S.badges.slice(-1).map(function(b){return '<span class="badge-chip">'+E(b.emoji||"🏆")+' '+E(b.label)+'</span>'}).join(""):'<span class="muted" style="font-size:12px">Readiness '+r.pct+'%</span>';
renderAppearance();
watchResumePreview();
if(!sampleMode)checkBadges();
}

function goTab(id){if(TITLES[id]){view=id;location.hash="#"+id}}
function tabAfter(id){var prev=view;view=id;render();if(prev!==id)scrollTo(0,0)}

var lastDrop=0;
var A={
"theme-toggle":function(){setAppearance('theme',S.settings.theme==='dark'?'light':'dark')},
"focus-toggle":function(){setAppearance('focus',!S.settings.focus)},
"appearance-toggle":function(){appearanceOpen=!appearanceOpen;renderAppearance();var target=document.querySelector(appearanceOpen?'[data-act=accent-set][aria-pressed=true]':'[data-act=appearance-toggle]');if(target)target.focus()},
"accent-set":function(b){if(Object.prototype.hasOwnProperty.call(ACCENTS,b.dataset.id))setAppearance('accent',b.dataset.id)},
"focus-off":function(){S.settings.focus=false;save();render()},
"backup":function(){dlBlob("career-hub-backup.json",new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));toast("Backup downloaded")},
"restore":function(){var f=document.createElement("input");f.type="file";f.accept=".json,application/json";f.onchange=async function(){try{var raw=JSON.parse(await f.files[0].text());if(!raw||typeof raw!=="object"||!raw.profile||typeof raw.profile!=="object"||Array.isArray(raw.profile)||!Array.isArray(raw.experiences))throw new Error("Invalid backup");if(COLLECTIONS.some(function(k){return raw[k]!=null&&(!Array.isArray(raw[k])||raw[k].some(function(x){return !x||typeof x!=="object"||Array.isArray(x)}))}))throw new Error("Invalid backup");if(raw.version>VER)throw new Error("Unsupported backup version");var restored=norm(migrate(raw));if(!confirm("Replace current data with this backup?"))return;sampleMode=false;S=restored;save();render();toast("Backup restored")}catch(e){toast("Invalid backup — data unchanged")}};f.click()},
close:function(){$("#dlg").close()},
new:function(b){edit(b.dataset.col,null)},
edit:function(b){edit(b.dataset.col,b.dataset.id)},
del:function(b){if(confirm("Delete this?")){S[b.dataset.col]=S[b.dataset.col].filter(function(x){return x.id!==b.dataset.id});save();render();toast("Deleted")}},
banktab:function(b){bankTab=b.dataset.id;render()},
tab:function(b){goTab(b.dataset.id)},
"go-bank":function(){goTab("bank")},
"go-resume":function(){goTab("resume")},
sample:function(){if(sampleMode){load();toast("Sample cleared")}else loadSample()},
"hide-banner":function(){bannerHidden=true;var b=$("#sample-banner");if(b)b.remove()},
move:function(b){var a=S.applications.filter(function(x){return x.id===b.dataset.id})[0];if(!a)return;if(a.status===b.value)return;a.status=b.value;save();render();toast("Moved to "+a.status)},
inc:function(b){var k=b.dataset.kind+":"+b.dataset.id;S.resume.inc[k]=b.checked;save();refreshPaper()},
tpl:function(b){S.resume.template=b.dataset.id;save();render()},
raccent:function(b){S.resume.accent=b.dataset.id;save();render()},
"dl-pdf":function(){downloadPdf()},
"mark-applied":function(b){var a=S.applications.filter(function(x){return x.id===b.dataset.id})[0];if(!a)return;a.status="Applied";if(!a.applied)a.applied=iso();save();render();toast("Marked as applied")},
"draft-email":function(b){var a=S.applications.filter(function(x){return x.id===b.dataset.id})[0]||{company:"[Company]",role:"[Role]"};var today=iso();var days=Math.floor((Date.now()-new Date((a.applied||today)+"T00:00"))/86400000);var tpl="Hi "+(a.contact||"[Name]")+",\n\nQuick follow-up on my application for the "+a.role+" role at "+a.company+(days>0?" — sent "+days+" day"+(days===1?"":"s")+" ago":"")+".\n\nI'm still very interested and would love to know if there's any update on timing. Happy to share additional work samples if useful.\n\nThanks for your time,\n"+(S.profile.name||"[Your name]");openInfo("Draft follow-up email",'<label>Copy and paste into your email<textarea id="emailtext" rows="12">'+E(tpl)+'</textarea></label><div class="foot"><button type="button" data-act="close">Close</button><button class="primary" data-act="copy-email">Copy</button></div>')},
"copy-email":function(){var t=$("#emailtext");if(t)Promise.resolve().then(function(){if(!navigator.clipboard)throw new Error("Clipboard unavailable");return navigator.clipboard.writeText(t.value)}).then(function(){toast("Copied")}).catch(function(){toast("Copy failed")})},
reset:function(){if(sampleMode){toast("Exit sample first");return}if(confirm("Erase ALL data? Cannot undo.")&&confirm("Really erase everything?")){S=blank();save();render();toast("Reset")}}
};

document.addEventListener("click",function(e){
if(Date.now()-lastDrop<300)return;
var t=e.target.closest("[data-act]");if(!t)return;
if(t.tagName==="SELECT"||t.tagName==="INPUT"||t.tagName==="TEXTAREA")return;
var fn=A[t.dataset.act];if(fn)fn(t);
});
document.addEventListener("change",function(e){
var t=e.target;
if(t.type==="checkbox"&&t.dataset.act&&A[t.dataset.act]){A[t.dataset.act](t)}
else if(t.tagName==="SELECT"&&t.dataset.act&&A[t.dataset.act]){A[t.dataset.act](t)}
else if(t.dataset&&t.dataset.note){S.notes[t.dataset.note]=t.value;save()}
});
document.addEventListener("input",function(e){var t=e.target;if(t.dataset&&t.dataset.note){S.notes[t.dataset.note]=t.value;save()}});
document.addEventListener("keydown",function(e){var card=e.target.closest&&e.target.closest(".kcard[data-act=edit]");if(card&&(e.key==="Enter"||e.key===" ")){e.preventDefault();A.edit(card)}});
document.addEventListener("submit",function(e){
if(e.target.id==="profile"){e.preventDefault();S.profile=Object.assign({},S.profile,Object.fromEntries(new FormData(e.target)));save();render();toast("Profile saved")}
});
document.addEventListener("dragstart",function(e){var c=e.target.closest(".kcard");if(!c)return;e.dataTransfer.setData("text/plain",c.dataset.id);e.dataTransfer.effectAllowed="move";c.classList.add("drag")});
document.addEventListener("dragend",function(e){var c=e.target.closest(".kcard");if(c)c.classList.remove("drag");$$(".kan-col.over").forEach(function(z){z.classList.remove("over")})});
document.addEventListener("dragover",function(e){var z=e.target.closest("[data-drop]");if(!z)return;e.preventDefault();z.classList.add("over")});
document.addEventListener("dragleave",function(e){var z=e.target.closest("[data-drop]");if(z&&!z.contains(e.relatedTarget))z.classList.remove("over")});
document.addEventListener("drop",function(e){var z=e.target.closest("[data-drop]");if(!z)return;e.preventDefault();z.classList.remove("over");lastDrop=Date.now();var id=e.dataTransfer.getData("text/plain");var a=S.applications.filter(function(x){return x.id===id})[0];if(a&&a.status!==z.dataset.drop){a.status=z.dataset.drop;save();render();toast("Moved to "+a.status)}});
document.addEventListener("click",function(e){var a=e.target.closest('nav a[href^="#"]');if(!a)return;var h=a.getAttribute("href").slice(1);if(h===view){e.preventDefault();scrollTo({top:0,behavior:"smooth"})}});
addEventListener("hashchange",function(){var h=location.hash.slice(1);view=TITLES[h]?h:"hub";render();scrollTo(0,0)});
addEventListener("beforeunload",function(){if(!sampleMode)lsSet(JSON.parse(JSON.stringify(S)))});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden"&&!sampleMode)lsSet(JSON.parse(JSON.stringify(S)))});
(function(){var h=location.hash.slice(1);view=TITLES[h]?h:"hub";load()})();
</script>
</body>
